[project]
name = "slideranalysis"
version = "0.1.0"
description = "Measurement analysis for the motorslider lab rig (slider_lab CSV dumps, campaign M0-M8)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.scripts]
fetch = "slideranalysis.fetch:main"
tickhealth = "slideranalysis.tickhealth:main"
noise = "slideranalysis.noise:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slideranalysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
